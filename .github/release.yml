changelog:
  exclude:
    labels:
      - skip-changelog
  categories:
    - title: Security
      labels:
        - security
        - hardening
    - title: Documentation
      labels:
        - documentation
        - diagrams
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Maintenance
      labels:
        - dependencies
        - ci
        - chore
    - title: Other changes
      labels:
        - "*"
